; router-b60.ini - model presets for the second llama.cpp router (start-b60.sh, port 9704, Intel Arc Pro B60 24 GB)
;
; Same format as router.ini, and the same model names: the port decides the card (9700 = R9700, 9704 = B60).
; Runs on llama.cpp's SYCL build b12613 (Level Zero). One model loaded at a time (--models-max 1): each
; fills most of the B60's ~24.1 GB. Edit the paths (/home/llm/locai/models/...) to where your GGUF files are.
; Flash attention isn't supported on the B60 with this build (llama.cpp turns it off by itself).
; Not here: vision-gemma (Gemma 4 31B) crashed the card every time its context passed about 10-12K tokens on
; this build; it runs on the R9700 instead. Numbers: BENCHMARKS.md, "Intel Arc Pro B60".

[review-qwen3.8]
; Qwen3.8 27B dense - code reviewer, loaded on demand (12-15 s swap).
; MTP: the model file has its own next-token layer; spec-type = draft-mtp uses it as a free draft:
; 29.4 tok/s on reviews against 15.7 without. Reviewer test: 23/25, 12/12 bugs caught.
; -ub 2048 is faster on long prompts but runs out of memory on an image request with MTP on, so 1024.
model = /home/llm/locai/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/qwen3.8-27b/mmproj-F16.gguf
alias = review-qwen3.8,qwen3.8
ctx-size = 49152
ngl = 99
batch-size = 2048
ubatch-size = 1024
spec-type = draft-mtp
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[fast-qwen]
; Qwen3.6 35B-A3B MoE (about 3B active) - default model, loaded at start. Fast chat, research, tool calls,
; images. No MTP layer. The 22.4 GB file doesn't fit whole: the experts of 4 of its 40 layers stay in system
; RAM. 53.7 tok/s (R9700: 65), 2.4 GB VRAM free. n-cpu-moe 2 was no faster and left less headroom.
model = /home/llm/locai/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/qwen3.6-35b-a3b/mmproj-F16.gguf
load-on-startup = true
ctx-size = 49152
ngl = 99
n-cpu-moe = 4
batch-size = 2048
ubatch-size = 1024
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
